<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in | Saathi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&family=Newsreader:wght@500;600&display=swap">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="wrap">
<header><h1>Saathi</h1><p>Train young adults leaving orphanages as eldercare companions, then match them to families paying from abroad.</p></header>
<main id="app">
<h2>Log in</h2>
<form id="login-form">
<label>Email <input name="email" type="email" required autocomplete="username"></label>
<label>Password <input name="password" type="password" required autocomplete="current-password"></label>
<button class="btn" type="submit">Log in</button>
</form>
<p class="mute">Coordinators, caregivers and families each log in with the account the coordinator made for them.</p>
</main>
<p class="mute" id="live" aria-live="polite"></p>
</div>
<script type="module" src="/js/login.js"></script>
</body>
</html>
