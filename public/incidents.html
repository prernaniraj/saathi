<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incidents | Saathi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&family=Fraunces:opsz,wght@9..144,500..700&display=swap">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="wrap">
<div id="shell"></div>
<h2>Incidents</h2>
<p class="mute">A visit logged as “Needs attention” opens an incident here. A coordinator assigns an owner and resolves it with a resolution.</p>
<form id="f" hidden>
  <label>Request
    <select name="requestId" id="req" required></select>
  </label>
  <label>Severity
    <select name="severity">
      <option>Low</option><option selected>Medium</option><option>High</option><option>Critical</option>
    </select>
  </label>
  <label>Description
    <textarea name="description" required></textarea>
  </label>
  <button class="btn" type="submit">Report an incident</button>
</form>
<main id="app"></main>
<p class="mute" id="live" aria-live="polite"></p>
</div>
<script type="module" src="/js/incidents.js"></script>
</body>
</html>
